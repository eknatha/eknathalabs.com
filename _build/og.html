<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Poppins';font-weight:700;src:url(../assets/fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:800;src:url(../assets/fonts/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:500;src:url(../assets/fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Noto Sans Telugu';font-weight:700;src:url(../assets/fonts/noto-sans-telugu-telugu-700-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#1c1b4b;color:#fff9ee;font-family:'Poppins',sans-serif;position:relative;overflow:hidden}
.stripe{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#ffb400 0 40px,#e63e2d 40px 80px,#fff9ee 80px 120px)}
.wrap{position:absolute;left:84px;top:84px;width:700px}
.brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:800;letter-spacing:-.01em}
.te{font-family:'Poppins';font-weight:700;color:#ffb400;font-size:36px;margin-top:62px}
h1{font-size:92px;line-height:1.0;letter-spacing:-.04em;font-weight:800;margin-top:6px}
h1 em{font-style:normal;color:#ffb400}
p{margin-top:28px;font-size:28px;font-weight:500;color:#d8d7f5;max-width:640px;line-height:1.4}
.art{position:absolute;right:50px;top:110px}
.url{position:absolute;left:84px;bottom:58px;font-size:24px;font-weight:700;color:#ffb400}
</style></head>
<body>
<div class="wrap">
  <div class="brand"><svg width="46" height="46" viewBox="0 0 30 30"><path d="M15 2l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ffb400"/></svg>EknathaLabs</div>
  <div class="te">Prayogashala</div>
  <h1>Technology,<br><em>open to everyone.</em></h1>
  <p>Free tools, labs and learning for every kind of technology.</p>
</div>
<svg class="art" width="340" height="340" viewBox="-120 -120 240 240">
  <circle r="112" fill="none" stroke="#ffb400" stroke-width="2" stroke-dasharray="3 8"/>
  <g fill="#ffb400">
    <ellipse rx="17" ry="50" cy="-58"/><ellipse rx="17" ry="50" cy="-58" transform="rotate(45)"/>
    <ellipse rx="17" ry="50" cy="-58" transform="rotate(90)"/><ellipse rx="17" ry="50" cy="-58" transform="rotate(135)"/>
    <ellipse rx="17" ry="50" cy="-58" transform="rotate(180)"/><ellipse rx="17" ry="50" cy="-58" transform="rotate(225)"/>
    <ellipse rx="17" ry="50" cy="-58" transform="rotate(270)"/><ellipse rx="17" ry="50" cy="-58" transform="rotate(315)"/>
  </g>
  <circle r="34" fill="#e63e2d"/><circle r="15" fill="#fff9ee"/>
</svg>
<div class="url">eknathalabs.com</div>
<div class="stripe"></div>
</body></html>
